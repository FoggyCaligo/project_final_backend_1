# 로컬 개발 환경 프로필 (spring.profiles.active=local)
# 환경변수가 있으면 환경변수 우선, 없으면 기본값(팀 공통 5432) 사용
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/today_fridge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres1234}
    hikari:
      connection-init-sql: ""
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
