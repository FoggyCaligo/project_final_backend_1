spring:
  application:
    name: project_final_backend1
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://ep-wispy-art-amny04jt-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: postgres
    password: FoggyCaligo123!
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE EXTENSION IF NOT EXISTS vector
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: today_fridge
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    debug: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8080

app:
  security:
    jwt:
      secret: "VG9kYXlGcmlkZ2VQcm9qZWN0QmFja2VuZDFTdGFydGVyU2VjcmV0S2V5Rm9ySldU"
      access-token-validity-seconds: 900
      refresh-token-validity-seconds: 604800
    cookie:
      secure: false
      same-site: Lax
  upload:
    root-path: uploads
  fastapi:
    base-url: http://localhost:8000
    service-key: change-me
    caller-service: spring-backend
    # RestTemplate → FastAPI (비전 추론은 첫 요청·GPU 로딩 시 수십 초 걸릴 수 있음)
    connect-timeout-ms: ${FASTAPI_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${FASTAPI_READ_TIMEOUT_MS:180000}
  vision:
    # 인식 완료 후 vision_recognition_request + file_asset 저장 (JSON analysis_result)
    persist-recognition: true
  mail:
    from: ${MAIL_USERNAME}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    verification-required: ${MAIL_VERIFICATION_REQUIRED:true}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:75029a3464f13bd358978e6ed88f9efd}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
