spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: project_final_backend1
    admin:
      enabled: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE EXTENSION IF NOT EXISTS vector
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      leak-detection-threshold: 20000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: today_fridge
    hibernate:
      # 최종 SQL 기준 운영/개발 스키마 드리프트 방지
      ddl-auto: update
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}          # Changed default to localhost for Mailpit
    port: ${MAIL_PORT:1025}               # Changed default SMTP port to 1025
    username: ${MAIL_USERNAME:}           # Cleared default username (not needed locally)
    password: ${MAIL_PASSWORD:}           # Cleared default password
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}   # false for Mailpit, true for real SMTP
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8080

app:
  security:
    jwt:
      secret: "VG9kYXlGcmlkZ2VQcm9qZWN0QmFja2VuZDFTdGFydGVyU2VjcmV0S2V5Rm9ySldU"
      access-token-validity-seconds: 3600
      refresh-token-validity-seconds: 1209600

    cookie:
      secure: ${APP_COOKIE_SECURE:false}
      same-site: ${APP_COOKIE_SAME_SITE:Lax}

  upload:
    root-path: uploads

  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    APP_FASTAPI_BASE_URL: http://fastapi:8000
    service-key: change-me
    caller-service: spring-backend

    connect-timeout-ms: ${FASTAPI_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${FASTAPI_READ_TIMEOUT_MS:300000}

  vision:
    persist-recognition: true

  mail:
    from: ${MAIL_FROM:noreply@todayfridge.com}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    verification-required: ${MAIL_VERIFICATION_REQUIRED:true}

  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:75029a3464f13bd358978e6ed88f9efd}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  naver:
    shopping:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}

  elevenst:
    openapi:
      key: ${ELEVENST_API_KEY:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
    #file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
