spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: project_final_backend1
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE EXTENSION IF NOT EXISTS vector
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      leak-detection-threshold: 20000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: today_fridge
    hibernate:
      # 최종 SQL 기준 운영/개발 스키마 드리프트 방지
      ddl-auto: validate
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8080

app:
  security:
    jwt:
      secret: "VG9kYXlGcmlkZ2VQcm9qZWN0QmFja2VuZDFTdGFydGVyU2VjcmV0S2V5Rm9ySldU"
      access-token-validity-seconds: 3600
      refresh-token-validity-seconds: 1209600
    cookie:
      secure: false
      same-site: Lax
  upload:
    root-path: uploads
  fastapi:
    base-url: http://localhost:8000
    service-key: change-me
    caller-service: spring-backend
    # RestTemplate → FastAPI (비전 추론은 첫 요청·GPU 로딩 시 수십 초 걸릴 수 있음)
    connect-timeout-ms: ${FASTAPI_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${FASTAPI_READ_TIMEOUT_MS:180000}
  vision:
    # 인식 완료 후 vision_recognition_request + file_asset 저장 (JSON analysis_result)
    persist-recognition: true
  mail:
    from: ${MAIL_FROM:noreply@todayfridge.com}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    verification-required: ${MAIL_VERIFICATION_REQUIRED:true}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:75029a3464f13bd358978e6ed88f9efd}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level
      %logger{36} - %msg%n"
    #file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"