name: Deploy Spring to Cloud Run

on:
  push:
    branches:
      - main_backup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev

      - name: Build Docker Image
        run: |
          gcloud builds submit . \
            --tag asia-northeast3-docker.pkg.dev/myfridge-495707/today-fridge-repo/spring-app \
            --suppress-logs

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy spring-app \
            --image asia-northeast3-docker.pkg.dev/myfridge-495707/today-fridge-repo/spring-app \
            --region asia-northeast3 \
            --platform managed \
            --allow-unauthenticated

      - name: Notify Discord Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content":"✅ [오늘 냉장고] Spring Boot Cloud Run 배포 완료"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content":"❌ [오늘 냉장고] Spring Boot Cloud Run 배포 실패"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"