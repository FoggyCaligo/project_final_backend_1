# 로컬 개발 환경 프로필 (spring.profiles.active=local)
# 환경변수가 있으면 환경변수 우선, 없으면 기본값(팀 공통 5432) 사용
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/today_fridge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
  jpa:
    hibernate:
      ddl-auto: validate
